# GhostLock execution tuning for the multicast_waiter route (HOCON); include
# it only from profiles whose route (or fallback) is multicast_waiter.
#
# Each punch is one lottery ticket: the destination copy races skb page
# recycling, so a single draw misses often. attempts is how many draws a run
# spends, arm_sequence how many draws share one arming round and arm_hold how
# many scheduling yields separate two rounds (the consumer thread must settle
# before the next arming). Values below match the device-verified vivo 6.1.145
# profile; a kernel that needs a different budget overrides them in its own
# route block.
execution {
  routes {
    multicast_waiter {
      attempts = 128
      arm_sequence = 16
      arm_hold = 20000
    }
  }
}
